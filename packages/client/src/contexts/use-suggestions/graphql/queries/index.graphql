query GetSuggestionsForCv($cvId: ID!) {
  getSuggestionsForCv(cvId: $cvId) {
    blockId
    comments {
      _id
      cvId
      cvVersionId
      blockId
      text
      suggestedText
      highlightType
      sentenceIndex
      startOffset
      endOffset
      status
      authorName
      createdAt
      updatedAt
    }
  }
}
